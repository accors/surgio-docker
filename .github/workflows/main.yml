name: Build Surgio v4 beta image and publish to Docker Hub

on:
  push:
    branches:
      - codex/v4-beta
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - config/**
      - ecosystem.config.cjs
      - env.sh
      - .github/workflows/main.yml
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/codex/v4-beta'
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64/v8
            linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/surgio:v4-beta
